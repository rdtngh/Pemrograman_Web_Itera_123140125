<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Mandiri - Biodata Sendiri</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        padding: 40px 20px;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        color: #1f2937;
      }

      .card {
        background: #111827;
        color: #f9fafb;
        padding: 18px;
        border-radius: 10px;
        line-height: 1.8;
        font-family: "Courier New", monospace;
        white-space: pre-wrap;
        margin-bottom: 20px;
      }

      .exercise-box {
        border-left: 5px solid #f59e0b;
        background: #fff7ed;
        color: #1f2937;
        padding: 18px;
        border-radius: 10px;
        margin-top: 22px;
      }

      h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section>
        <h1>Latihan Mandiri: Biodata Sendiri</h1>
        <div id="biodataOutput" class="card"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan Mandiri: Cek Tahun Kabisat</h2>
        <div id="kabisatOutput" class="card"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan Mandiri: Tabel Perkalian</h2>
        <div id="perkalianOutput" class="card"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan Mandiri: Nilai Tertinggi dan Terendah</h2>
        <div id="nilaiOutput" class="card"></div>
      </section>

      <section class="exercise-box">
        <h2>Latihan Mandiri: Ambil Data User</h2>
        <button id="ambilUserBtn" type="button">Ambil Data User</button>
        <div id="userOutput" class="card" style="margin-top: 15px;"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
